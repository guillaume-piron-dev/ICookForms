name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ICOokForms ${{ github.ref }}
          body: |
            ## ICOokForms Release ${{ github.ref_name }}
            
            **🏆 The World's Reference Cookie Audit Software**
            
            ### ✨ Features
            - 🔍 Cookie scanning and analysis
            - 🔒 Security vulnerability detection (8 types: XSS, CSRF, Session Hijacking, MITM, etc.)
            - 📋 Compliance checking (GDPR, CCPA, LGPD, POPIA, PIPEDA, PDPA, ePrivacy)
            - 🎯 Tracking detection (50+ vendors)
            - 📊 Professional reports (JSON, CSV, HTML, PDF)
            - ⚡ High performance with async/await
            - 🐳 Docker support
            
            ### 📦 Downloads
            Choose the binary for your platform below.
            
            ### 🚀 Installation
            
            **Linux / macOS:**
            ```bash
            # Download and extract
            tar -xzf icookforms-*.tar.gz
            
            # Make executable
            chmod +x icookforms
            
            # Move to PATH
            sudo mv icookforms /usr/local/bin/
            
            # Verify installation
            icookforms --version
            ```
            
            **Windows:**
            ```powershell
            # Extract the ZIP
            # Add the directory to your PATH or move icookforms.exe to a directory in PATH
            
            # Verify installation
            icookforms.exe --version
            ```
            
            ### 📚 Quick Start
            ```bash
            # Scan a website
            icookforms scan https://example.com
            
            # Analyze with GDPR compliance
            icookforms scan https://example.com --regulation gdpr
            
            # Generate PDF report
            icookforms report --scan-id <uuid> --format pdf
            
            # Check compliance for all regulations
            icookforms compliance --scan-id <uuid> --all
            ```
            
            ### 📖 Documentation
            - [README](https://github.com/guillaume-piron-dev/ICookForms/blob/main/README.md)
            - [Documentation](https://github.com/guillaume-piron-dev/ICookForms/tree/main/docs)
            - [Examples](https://github.com/guillaume-piron-dev/ICookForms/tree/main/examples)
            
            ### 🔐 Checksums
            SHA-256 checksums are provided for all binaries. Verify with:
            ```bash
            sha256sum -c icookforms-*.sha256
            ```
            
            ### 📝 Changelog
            See [CHANGELOG.md](https://github.com/guillaume-piron-dev/ICookForms/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
  
  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: icookforms
            asset_name: icookforms-linux-x86_64
          
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: icookforms
            asset_name: icookforms-linux-x86_64-musl
          
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: icookforms
            asset_name: icookforms-linux-arm64
          
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: icookforms.exe
            asset_name: icookforms-windows-x86_64.exe
          
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: icookforms
            asset_name: icookforms-macos-x86_64
          
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: icookforms
            asset_name: icookforms-macos-arm64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      
      - name: Install cross-compilation tools (ARM64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --all-features
      
      - name: Strip binary (Unix only)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true
      
      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256
      
      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}
          sha256sum ${{ matrix.asset_name }}.zip > ${{ matrix.asset_name }}.zip.sha256
      
      - name: Upload release asset (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz
          asset_name: ${{ matrix.asset_name }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload checksum (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz.sha256
          asset_name: ${{ matrix.asset_name }}.tar.gz.sha256
          asset_content_type: text/plain
      
      - name: Upload release asset (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip
          asset_name: ${{ matrix.asset_name }}.zip
          asset_content_type: application/zip
      
      - name: Upload checksum (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip.sha256
          asset_name: ${{ matrix.asset_name }}.zip.sha256
          asset_content_type: text/plain
  
  publish-crates-io:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
  
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [create-release, build-release]
    if: always()
    
    steps:
      - name: Generate release summary
        run: |
          echo "## 🎉 Release Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Built Platforms (6)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux x86_64 (GNU)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux x86_64 (musl)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux ARM64" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS x86_64 (Intel)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS ARM64 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Security" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256 checksums provided for all binaries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Create Release:** ${{ needs.create-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Binaries:** ${{ needs.build-release.result }}" >> $GITHUB_STEP_SUMMARY
